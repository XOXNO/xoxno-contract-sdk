[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/XOXNO/xoxno-contract-sdk"
homepage = "https://xoxno.com"
authors = ["XOXNO"]

[workspace.dependencies]
soroban-sdk = "28.0.0"
xoxno-contract-sdk = { version = "0.2.0", path = "crates/xoxno-contract-sdk" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
