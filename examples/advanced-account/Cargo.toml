[package]
name = "advanced-account"
version = "0.0.0"
description = "Example: owner-controlled SDK batches, routed strategies and a flash-position receiver."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
xoxno-contract-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
xoxno-contract-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
