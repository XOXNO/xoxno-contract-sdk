[package]
name = "price-reader"
version = "0.0.0"
description = "Example: read XOXNO Lending prices, USD values and borrow headroom in a contract."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
xoxno-contract-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
xoxno-contract-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
