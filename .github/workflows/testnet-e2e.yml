name: SDK testnet E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-testnet-e2e
  cancel-in-progress: false

jobs:
  testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lane: [run, advanced, controlled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.95"
          targets: wasm32v1-none

      - name: Install pinned Stellar CLI
        run: bash .github/scripts/install-stellar-cli.sh

      - name: Harness regression tests
        run: python3 -m unittest discover -s tests/e2e -p 'test_*.py'

      - name: Build SDK example contracts
        run: stellar contract build --locked --out-dir target/testnet-e2e-wasm

      - name: Deploy and verify against the existing lending testnet
        run: python3 tests/e2e/${{ matrix.lane }}.py --output target/testnet-e2e-report

      - name: Publish result summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('target/testnet-e2e-report/report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if path.exists():
                  report = json.loads(path.read_text())
                  summary.write(f"SDK testnet E2E: **{report['status']}**\n\n")
                  for name, passed in report['cases'].items():
                      summary.write(f"- {name}: {'PASS' if passed else 'FAIL'}\n")
                  for error in report['errors']:
                      summary.write(f"\n```text\n{error}\n```\n")
              else:
                  summary.write('SDK testnet E2E: **FAIL — no report produced**\n')
          PY

      - name: Keep public evidence and exact deployed WASM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-testnet-e2e-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/testnet-e2e-report/*.json
            target/testnet-e2e-report/*.stdout
            target/testnet-e2e-report/*.stderr
            target/testnet-e2e-report/*.signed.xdr
            target/testnet-e2e-wasm/*.wasm
