name: Mainnet drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stellar-cli
        run: bash .github/scripts/install-stellar-cli.sh

      - name: The embedded contracts are the code deployed on mainnet
        run: python3 scripts/check_mainnet.py
